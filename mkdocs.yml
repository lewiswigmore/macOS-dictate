site_name: dictate
site_description: Local voice typing for macOS.
site_url: https://lewiswigmore.github.io/macOS-dictate/
repo_url: https://github.com/lewiswigmore/macOS-dictate
repo_name: lewiswigmore/macOS-dictate
edit_uri: edit/main/docs/

nav:
  - Home: index.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
  features:
    - navigation.top
    - content.code.copy
    - search.suggest
  logo: assets/dictate-mark.svg
  favicon: assets/dictate-mark-32.png

extra_css:
  - assets/dictate.css

plugins:
  - search
